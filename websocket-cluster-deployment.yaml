apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-cluster-deployment
  labels:
    app: websocket-cluster
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-cluster
  template:
    metadata:
      labels:
        app: websocket-cluster
    spec:
      containers:
      - name: websocket-server
        image: websocket-cluster-service:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: websocket
        
        env:
        - name: NATS_URL
          value: "nats://nats-service:4222"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
          
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-cluster-service
spec:
  type: ClusterIP
  selector:
    app: websocket-cluster
  ports:
  - port: 8080
    targetPort: 8080
    name: websocket