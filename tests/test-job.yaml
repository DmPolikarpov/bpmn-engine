apiVersion: batch/v1
kind: Job
metadata:
  name: mes-integration-test
spec:
  # ttlSecondsAfterFinished: 30
  template:
    spec:
      containers:
      - name: tester
        image: mes-tester:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: "bpmn-db-rw"
        - name: NATS_HOST
          value: "nats-service"
        - name: WS_SERVICE_URL
          value: "ws://websocket-cluster-service:8080/ws/status"
        - name: GATEWAY_URL_BASE
          value: "http://http-cluster-service:8080/api/v1/process/instances"
      restartPolicy: Never
  backoffLimit: 1